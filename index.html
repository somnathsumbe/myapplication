<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="A fast, installable dashboard for your applications.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Hub — Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="./" aria-label="My Hub home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg></span>
        <span><strong>My</strong><small>APPLICATION HUB</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <a class="nav-link active" href="./" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg><span>Dashboard</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-foot"><span class="online-dot"></span> Local workspace <span class="version">v1.0</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        <div class="breadcrumb-line"><span>Workspace</span><span class="breadcrumb-chevron" aria-hidden="true"></span><strong id="breadcrumbCurrent">Dashboard</strong></div>
        <div class="topbar-actions">
          <button class="install-button" id="installButton" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"></path></svg><span>Install</span></button>
          <button class="icon-button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"></path></svg></button>
          <div class="avatar" title="Personal workspace">S</div>
        </div>
      </header>

      <div class="content-wrap">
        <section class="welcome-row">
          <div>
            <div class="eyebrow"><span class="eyebrow-line"></span> YOUR PERSONAL COMMAND CENTER</div>
            <h1>Dashboard<span class="title-period">.</span></h1>
          </div>
        </section>
        <section class="apps-section" aria-labelledby="applicationsHeading">
          <div class="section-heading">
            <h2 id="applicationsHeading">Applications</h2>
          </div>
          <div class="apps-grid" id="appsGrid" aria-live="polite"><div class="loading-state" role="status">Loading applications...</div></div>
          <p class="app-status" id="appStatus" role="status" aria-live="polite"></p>
        </section>
        <footer class="page-footer"><span>Made for your workflow <span class="footer-heart">♥</span></span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.5-2.8 8-7 10-4.2-2-7-5.5-7-10V6l7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg> Personal workspace <span class="footer-separator">·</span> No account required</span></footer>
      </div>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
