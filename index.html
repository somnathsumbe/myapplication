<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="Your personal workspace dashboard.">
  <title>My Hub — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="Nexus Hub home">
        <span class="brand-mark"><i class="bi bi-grid-1x2-fill"></i></span>
        <span><strong>My</strong><small>APPLICATION HUB</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <a class="nav-link active" href="index.html" aria-current="page"><i class="bi bi-grid"></i><span>Dashboard</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-foot"><span class="online-dot"></span> Local workspace <span class="version">v1.0</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation"><i class="bi bi-list"></i></button>
        <div class="breadcrumb-line"><span>Workspace</span><i class="bi bi-chevron-right"></i><strong id="breadcrumbCurrent">Dashboard</strong></div>
        <div class="topbar-actions">
          <button class="icon-button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
          <div class="avatar" title="Personal workspace">S</div>
        </div>
      </header>

      <div class="content-wrap">
        <section class="welcome-row">
          <div>
            <div class="eyebrow"><span class="eyebrow-line"></span> YOUR PERSONAL COMMAND CENTER</div>
            <h1>Dashboard<span class="title-period">.</span></h1>
          </div>
        </section>
        <section class="apps-section" aria-labelledby="applicationsHeading">
          <div class="section-heading">
            <h2 id="applicationsHeading">Applications</h2>
          </div>
          <div class="apps-grid" id="appsGrid" aria-live="polite"></div>
          <p class="app-status" id="appStatus" role="status" aria-live="polite"></p>
        </section>
        <footer class="page-footer"><span>Made for your workflow <span class="footer-heart">♥</span></span><span><i class="bi bi-shield-check me-1"></i> Personal workspace <span class="footer-separator">·</span> No account required</span></footer>
      </div>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
