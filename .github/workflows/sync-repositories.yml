name: Sync GitHub repositories

on:
  schedule:
    # Daily at 02:30 UTC (08:00 IST)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: somnathsumbe
        run: node scripts/sync-repositories.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet -- data/applications.json; then
            echo "Repository list is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/applications.json
          git commit -m "chore: sync GitHub repositories"
          git push origin HEAD:main
