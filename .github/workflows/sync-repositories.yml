name: Sync GitHub repositories

on:
  push:
    branches:
      - main
    # Prevent the sync bot's own data-only commit from triggering another run.
    paths-ignore:
      - "data/applications.json"
      - "data/repository-sync-status.json"
  schedule:
    # Temporary test schedule: daily at 04:40 UTC (10:10 IST).
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait 3 minutes after a push
        if: github.event_name == 'push'
        run: |
          echo "Push detected. Waiting 180 seconds before repository sync."
          sleep 180

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync repositories and record status
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: somnathsumbe
        run: node scripts/sync-repositories.mjs

      - name: Commit dashboard data and sync status
        if: always()
        run: |
          if git diff --quiet -- data/applications.json data/repository-sync-status.json; then
            echo "No dashboard data or sync status changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/applications.json data/repository-sync-status.json
            git commit -m "chore: update repository sync status"
            git push origin HEAD:main
          fi

      - name: Mark workflow failed when sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1
