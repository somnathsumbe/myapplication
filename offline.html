<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="robots" content="noindex">
  <title>You're offline — My Hub</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { display: grid; min-width: 320px; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 440px); padding: 36px; border: 1px solid #e7eaf1; border-radius: 20px; background: #fff; box-shadow: 0 12px 40px #16223a12; text-align: center; }
    .mark { display: grid; width: 56px; height: 56px; place-items: center; margin: 0 auto 20px; border-radius: 17px; background: #eeedff; color: #635bff; font-size: 26px; font-weight: 800; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.7px; }
    p { margin: 12px 0 24px; color: #738097; font-size: 14px; line-height: 1.65; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 10px; background: #635bff; color: #fff; font-size: 13px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #a9a4ff; outline-offset: 3px; }
    @media (max-width: 400px) { main { padding: 28px 20px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>You're offline</h1>
    <p>My Hub needs a connection to load this page. Reconnect to the internet and try again.</p>
    <a href="./">Back to My Hub</a>
  </main>
</body>
</html>
